<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>作り手のアイコン ラフ（5 秒テスト用カード・小サイズ確認）</title>
<!--
  作り手（SUKIMA の作者名義）のアイコンのラフ。design/brand/render.mjs で PNG にする。
  - 5 秒テストのカードは「アイコン＋名前」だけにする。比べたいのは名前と形なので、色・配置・書体は全案でそろえる
    （色が違うと、好みの色で選ばれてしまい、名前の印象を測れない）
  - 作り手のマークは「円」、作品（SUKIMA）のロゴは「傾けた角丸長方形の文字ロゴ」。形で役割を分け、
    墨線・ずらした影・Dela Gothic One の文法だけを案B と共有する
  - 作り手の地の色は黄。トマトは SUKIMA の色として残し、動画の締めで 2 つが並んでも取り違えないようにする
  - SNS のプロフィール画像は円に切り抜かれるので、マークは円の内側だけで完結させる（影も付けない）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@700;900&display=block" rel="stylesheet">
<style>
:root {
  --bg: #fff4e0; --ink: #1c1a17; --white: #ffffff;
  --accent: #ff5b3a; --yellow: #ffd23f; --blue: #4a74f5; --pink: #ff9cc2; --teal: #2bb3a3; --purple: #9b7bf0;
  --dark-bg: #1d1a17;
  --font-body: 'Noto Sans JP', sans-serif;
  --font-pop: 'Dela Gothic One', 'Noto Sans JP', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #ddd; font-family: var(--font-body); color: var(--ink); }
svg { display: block; }

/* 5 秒テストのカード（540×540 を deviceScaleFactor 2 で 1080×1080 に撮る） */
.cards { display: flex; gap: 24px; flex-wrap: wrap; }
.card { width: 540px; height: 540px; background: var(--bg); position: relative; overflow: hidden;
  background-image: radial-gradient(circle, rgba(28,26,23,0.08) 2px, transparent 2.5px); background-size: 22px 22px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
.card .mark { width: 300px; height: 300px; }
.card .name { font-family: var(--font-pop); font-size: 58px; line-height: 1; letter-spacing: 0.04em; white-space: nowrap; }
.card .sub { font-weight: 900; font-size: 20px; letter-spacing: 0.18em; opacity: 0.6; margin-top: -12px; }

/* 小さいサイズの確認表（ライト／ダーク、円に切り抜いた状態） */
.sheet { margin-top: 24px; width: 1104px; background: #fff; padding: 20px 24px; border-radius: 8px; }
.sheet h2 { margin: 0 0 12px; font-size: 18px; }
.row { display: grid; grid-template-columns: 170px 1fr 1fr; align-items: center; gap: 16px; padding: 10px 0; border-top: 1px solid #ddd; }
.row .label { font-weight: 900; font-size: 16px; }
.strip { display: flex; align-items: center; gap: 18px; padding: 14px 16px; border-radius: 8px; }
.strip.light { background: #ffffff; border: 1px solid #ddd; }
.strip.dark { background: #000; }
.strip .c { border-radius: 50%; overflow: hidden; flex: none; }
.strip .c svg { width: 100%; height: 100%; }
.strip small { color: #888; font-size: 11px; }
.head { display: grid; grid-template-columns: 170px 1fr 1fr; gap: 16px; font-size: 13px; color: #666; }

/* 並べたときの確認：SUKIMA のロゴと作り手のマーク（動画の締め・ヘッダー） */
.pair { display: flex; align-items: center; gap: 20px; padding: 18px; background: var(--bg); border-radius: 8px; margin-top: 8px; }
.logo { display: inline-block; font-family: var(--font-pop); font-size: 34px; line-height: 1; letter-spacing: 0.06em;
  color: #fff; background: var(--accent); padding: 10px 16px 12px; border: 4px solid var(--ink); border-radius: 18px;
  transform: rotate(-3deg); box-shadow: 5px 5px 0 var(--ink); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; white-space: nowrap; }
.logo .slit { display: inline-block; width: 10px; height: 1.6em; margin: -0.4em 3px -0.4em 4px; vertical-align: middle;
  background: var(--bg); border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); transform: rotate(14deg); }
.pair .by { font-weight: 900; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.pair .by svg { width: 44px; height: 44px; }
</style>
</head>
<body>

<!-- マークの定義。viewBox 200×200、円は中心 100,100・半径 92（プロフィールの円の切り抜きに合わせる） -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 1. ニヤリ：片方の口角だけ上がった三日月。目は描かない（顔にすると「キャラ」になり子どもっぽく寄るため、口元だけを記号にする） -->
    <g id="m-niyari">
      <circle cx="100" cy="100" r="92" fill="var(--yellow)" stroke="var(--ink)" stroke-width="9"/>
      <!-- 最初のラフは右端に口角の鉤を付けたが、Amazon の矢印の笑顔に似たので外した。左は平ら、右だけ上がる非対称で「ニヤリ」を出す -->
      <path d="M46 104 Q 96 150 152 80 Q 108 118 46 104 Z" fill="var(--white)" stroke="var(--ink)" stroke-width="9" stroke-linejoin="round"/>
    </g>
    <!-- 2. WATTO：まんなかの「場」を 4 つの札（人・スマホ）が囲み、間から光が出る。ちゃぶ台ラボの「囲む」を物ではなく形で残す -->
    <g id="m-watto">
      <circle cx="100" cy="100" r="92" fill="var(--yellow)" stroke="var(--ink)" stroke-width="9"/>
      <g stroke="var(--ink)" stroke-width="9" stroke-linecap="round">
        <line x1="134" y1="66" x2="152" y2="48"/><line x1="134" y1="134" x2="152" y2="152"/>
        <line x1="66" y1="134" x2="48" y2="152"/><line x1="66" y1="66" x2="48" y2="48"/>
      </g>
      <circle cx="100" cy="100" r="30" fill="var(--white)" stroke="var(--ink)" stroke-width="9"/>
      <!-- 札は 4 人それぞれ違う差し色にする（トマトは SUKIMA の色なので作り手では使わない。03 N-5）。
           色が違うことで「いろんな人が集まる」も伝わる -->
      <g stroke="var(--ink)" stroke-width="8" stroke-linejoin="round">
        <rect x="88" y="26" width="24" height="24" rx="5" fill="var(--blue)"/><rect x="150" y="88" width="24" height="24" rx="5" fill="var(--pink)"/>
        <rect x="88" y="150" width="24" height="24" rx="5" fill="var(--teal)"/><rect x="26" y="88" width="24" height="24" rx="5" fill="var(--purple)"/>
      </g>
    </g>
    <!-- 4. PATTO（パッと）：真ん中で白い光が弾け、色の粒が飛ぶ。WATTO（囲む輪）と違い「中心から外へ」の形。
         粒は 3 つで大きさも位置もそろえない（4 つ対称だと WATTO・太陽に寄るため）。切り替えに備えたラフ -->
    <g id="m-patto">
      <circle cx="100" cy="100" r="92" fill="var(--yellow)" stroke="var(--ink)" stroke-width="9"/>
      <polygon points="100.0,40.0 112.6,69.5 142.4,57.6 130.5,87.4 160.0,100.0 130.5,112.6 142.4,142.4 112.6,130.5 100.0,160.0 87.4,130.5 57.6,142.4 69.5,112.6 40.0,100.0 69.5,87.4 57.6,57.6 87.4,69.5" fill="var(--white)" stroke="var(--ink)" stroke-width="9" stroke-linejoin="round"/>
      <g stroke="var(--ink)" stroke-width="7">
        <circle cx="164.7" cy="73.2" r="10" fill="var(--blue)"/>
        <circle cx="73.2" cy="164.7" r="8" fill="var(--pink)"/>
        <circle cx="37.2" cy="74.0" r="6.5" fill="var(--teal)"/>
      </g>
    </g>
    <!-- 3. わちゃ：重なった吹き出し 3 つ。「みんなが同時にしゃべっている」様子 -->
    <g id="m-wacha">
      <circle cx="100" cy="100" r="92" fill="var(--yellow)" stroke="var(--ink)" stroke-width="9"/>
      <g stroke="var(--ink)" stroke-width="8" stroke-linejoin="round">
        <path d="M44 84 a36 28 0 1 1 30 27 l-16 14 l2 -18 a36 28 0 0 1 -16 -23 Z" fill="var(--white)"/>
        <path d="M156 78 a34 26 0 1 0 -28 26 l14 13 l-1 -16 a34 26 0 0 0 15 -23 Z" fill="var(--pink)"/>
        <polygon points="86,148 78,174 104,156" fill="var(--teal)"/>
        <ellipse cx="106" cy="134" rx="38" ry="27" fill="var(--teal)"/>
      </g>
    </g>
  </defs>
</svg>

<div class="cards">
  <div class="card" id="card-niyari">
    <svg class="mark" viewBox="-4 -4 216 216"><circle cx="108" cy="108" r="96.5" fill="var(--ink)"/><use href="#m-niyari"/></svg>
    <div class="name">ニヤリ製作所</div>
    <div class="sub">NIYARI WORKS</div>
  </div>
  <div class="card" id="card-watto">
    <svg class="mark" viewBox="-4 -4 216 216"><circle cx="108" cy="108" r="96.5" fill="var(--ink)"/><use href="#m-watto"/></svg>
    <div class="name">WATTO</div>
    <div class="sub">ワット</div>
  </div>
  <div class="card" id="card-wacha">
    <svg class="mark" viewBox="-4 -4 216 216"><circle cx="108" cy="108" r="96.5" fill="var(--ink)"/><use href="#m-wacha"/></svg>
    <div class="name">わちゃ</div>
    <div class="sub">WACHA</div>
  </div>
  <div class="card" id="card-patto">
    <svg class="mark" viewBox="-4 -4 216 216"><circle cx="108" cy="108" r="96.5" fill="var(--ink)"/><use href="#m-patto"/></svg>
    <div class="name">PATTO</div>
    <div class="sub">パッと</div>
  </div>
</div>

<div class="sheet" id="sheet">
  <h2>小さいサイズの確認（円に切り抜き。左から 16・24・32・48・96px）</h2>
  <div class="head"><span></span><span>ライトの画面</span><span>ダークの画面</span></div>
  <div class="row" data-id="niyari"><span class="label">ニヤリ製作所</span></div>
  <div class="row" data-id="watto"><span class="label">WATTO</span></div>
  <div class="row" data-id="patto"><span class="label">PATTO</span></div>
  <div class="row" data-id="wacha"><span class="label">わちゃ</span></div>

  <h2 style="margin-top:18px">SUKIMA と並べたとき（動画の締め・ヘッダーの想定）</h2>
  <div class="pair">
    <span class="logo">SUKI<span class="slit"></span>MA</span>
    <span class="by"><svg viewBox="0 0 200 200"><use href="#m-niyari"/></svg>ニヤリ製作所</span>
    <span class="by"><svg viewBox="0 0 200 200"><use href="#m-watto"/></svg>WATTO</span>
    <span class="by"><svg viewBox="0 0 200 200"><use href="#m-patto"/></svg>PATTO</span>
    <span class="by"><svg viewBox="0 0 200 200"><use href="#m-wacha"/></svg>わちゃ</span>
  </div>
</div>

<script>
// 確認表の行を組み立てる（同じ SVG を大きさだけ変えて並べる）
const sizes = [16, 24, 32, 48, 96];
for (const row of document.querySelectorAll('.row')) {
  for (const mode of ['light', 'dark']) {
    const strip = document.createElement('div');
    strip.className = 'strip ' + mode;
    for (const s of sizes) {
      const c = document.createElement('div');
      c.className = 'c';
      c.style.width = c.style.height = s + 'px';
      c.innerHTML = `<svg viewBox="4 4 192 192"><use href="#m-${row.dataset.id}"/></svg>`;
      strip.appendChild(c);
    }
    row.appendChild(strip);
  }
}
</script>
</body>
</html>
